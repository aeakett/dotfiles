# from https://github.com/rose-pine/starship
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = """
$character\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$fill\
$time\n  \
[󱞪](fg:iris) \
"""

palette = "rose-pine"

[palettes.rose-pine]
overlay = '#26233a'
love = '#eb6f92'
gold = '#f6c177'
rose = '#ebbcba'
pine = '#31748f'
foam = '#9ccfd8'
iris = '#c4a7e7'

[directory]
format = "[](fg:overlay)[ $path ]($style)[$read_only ]($read_only_style)[](fg:overlay) "
style = "bg:overlay fg:pine"
read_only_style = "bg:overlay fg:pine"
read_only = ""
truncation_length = 6
truncation_symbol = "…/"
truncate_to_repo = false

[directory.substitutions]
Documents = "󰈙"
Downloads = " "
Music = " "
Pictures = " "

[fill]
style = "fg:overlay"
symbol = " "

[git_branch]
format = "[](fg:overlay)[ $symbol $branch ]($style)"
style = "bg:overlay fg:foam"
symbol = ""

[git_status]
disabled = false
style = "bg:overlay fg:love"
format = '([$all_status$ahead_behind]($style))[](fg:overlay) '
up_to_date = '[ ✓ ](bg:overlay fg:iris)'
untracked = '[?\($count\)](bg:overlay fg:gold)'
stashed = '[\$](bg:overlay fg:iris)'
modified = '[!\($count\)](bg:overlay fg:gold)'
renamed = '[»\($count\)](bg:overlay fg:iris)'
deleted = '[✘\($count\)](style)'
staged = '[++\($count\)](bg:overlay fg:gold)'
ahead = '[⇡\(${count}\)](bg:overlay fg:foam)'
diverged = '⇕[\[](bg:overlay fg:iris)[⇡\(${ahead_count}\)](bg:overlay fg:foam)[⇣\(${behind_count}\)](bg:overlay fg:rose)[\]](bg:overlay fg:iris)'
behind = '[⇣\(${count}\)](bg:overlay fg:rose)'

[time]
disabled = true
format = " [](fg:overlay)[ $time 󰴈 ]($style)[](fg:overlay)"
style = "bg:overlay fg:rose"
time_format = "%I:%M%P"
use_12hr = true

[username]
disabled = false
format = "[ $user]($style)"
show_always = true
style_root = "bg:overlay fg:iris"
style_user = "bg:overlay fg:iris"

[hostname]
style = "bg:overlay fg:iris"
format = '[@]($style)[$hostname ]($style)[](fg:overlay) '
aliases = { "s-bor-vpi151000" = "ssm-webprod 󰯊",
            "s-ssm-vdi151200" = "ssm-webdev ",
            "W-SSM-A096925" = "odemin 󰇅",
            "W-SSM-A096960" = "tsuga 󰇅",
            "rubus" = "rubus 󰇅",
            "picea" = "picea 󰇅",
            "salix" = "salix 󰇅",
            "s-bor-vpa151250" = "ledum 󰒍",
            "s-bor-vpq151251" = "postgres ",
            "lomax" ="lomax 󱝠" }
ssh_only = false

[character]
disabled = false
format = "$symbol"
success_symbol = '[](fg:overlay)'
error_symbol = '[](fg:overlay)[](bold bg:overlay fg:love)'
