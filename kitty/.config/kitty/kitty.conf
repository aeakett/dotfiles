# ==============================================================================
# Kitty Low-Resource Windows-Comfort Configuration
# ==============================================================================

# --- Font Settings ---
font_family      "FiraCode Nerd Font Propo"
font_size        11.0

# --- Window & Transparency ---
background_opacity 1.00
remember_window_size  no
initial_width         800
initial_height        600

# --- Tab Bar Styling (To look clean and modern) ---
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   slanted

# ==============================================================================
# Keyboard Shortcuts (Keyboard Bindings)
# ==============================================================================
# Clear default Kitty shortcuts for copy/paste to prevent conflicts
clear_all_shortcuts no

# Rebind Ctrl+C and Ctrl+V to act like Windows.
# Note: To interrupt a running process in Linux, you will now use Ctrl+Shift+C.
map ctrl+c copy_to_clipboard
map ctrl+v paste_from_clipboard

# Built-in font scaling (Ctrl + Plus, Ctrl + Minus, Ctrl + 0)
map ctrl+equal     change_font_size all +1.0
map ctrl+minus     change_font_size all -1.0
map ctrl+0         change_font_size all 0

# Built-in Tab Management shortcuts
map ctrl+shift+t         new_tab
map ctrl+w         close_tab
map ctrl+tab       next_tab
map ctrl+shift+tab previous_tab



# BEGIN_KITTY_THEME
# Gruvbox Material Dark Medium
include current-theme.conf
# END_KITTY_THEME