"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](color_base01)\
$character\
$username\
[@](bg:color_base01 fg:color_base2)\
$hostname\
[](bg:color_blue fg:color_base01)\
$directory\
[](fg:color_blue bg:color_yellow)\
$git_branch\
$git_status\
[](fg:color_yellow bg:color_base01)\

[ ](fg:color_base01)\
"""

palette = 'terrible_solarized'

[palettes.terrible_solarized]
color_base03 = '#002b36'
color_base02 = '#073642'
color_base01 = '#586e75'
color_base00 = '#657b83'
color_base0 = '#839496'
color_base1 = '#93a1a1'
color_base2 = '#eee8d5'
color_base3 = '#fdf6e3'
color_yellow = '#b58900'
color_orange = '#cb4b16'
color_red = '#dc322f'
color_magenta = '#d33682'
color_violet = '#6c71c4'
color_blue = '#268bd2'
color_cyan = '#2aa198'
color_green = '#859900'

[username]
show_always = true
style_user = "bg:color_base01 fg:color_base2"
style_root = "bg:color_base01 fg:color_base2"
format = '[$user]($style)'

[hostname]
style = "bg:color_base01 fg:color_base2"
format = '[$hostname ]($style)'
aliases = { "s-bor-vpi151000" = "ssm-webprod",
            "s-ssm-vdi151200" = "ssm-webdev",
            "W-SSM-A096925" = "odemin",
            "s-bor-vpa151250" = "ledum",
            "s-bor-vpq151251" = "postgres"}
ssh_only = false

[directory]
style = "fg:color_base2 bg:color_blue"
read_only_style = "fg:color_base2 bg:color_blue"
read_only = ""
format = "[ $path]($style)[ $read_only ]($read_only_style)"
truncation_length = 6
truncation_symbol = "…/"
truncate_to_repo = false

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:color_yellow"
format = '[[ $symbol $branch ](fg:color_base2 bg:color_yellow)]($style)'

[git_status]
style = "bg:color_yellow"
format = '[[($all_status$ahead_behind )](fg:color_base2 bg:color_yellow)]($style)'

[character]
disabled = false
format = "$symbol"
success_symbol = '[](bold bg:color_base01 fg:color_yellow)'
error_symbol = '[ ](bold bg:color_base01 fg:color_yellow)'
vimcmd_symbol = '[](bold fg:color_green)'
vimcmd_replace_one_symbol = '[](bold fg:color_purple)'
vimcmd_replace_symbol = '[](bold fg:color_purple)'
vimcmd_visual_symbol = '[](bold fg:color_yellow)'
